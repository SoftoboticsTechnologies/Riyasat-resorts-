<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
</helmet>

<div style="background:#F5EFE5;overflow-x:hidden;max-width:100vw">
  <dc-import name="SiteHeader" active="gallery" hint-size="100%,80px"></dc-import>

  <main style="padding-top:{{ topPad }};padding-bottom:{{ botPad }}">

    <section data-screen-label="Page header" style="background:#3F2423;border-bottom:1px solid rgba(209,168,89,.3);padding:clamp(56px,8vw,120px) clamp(20px,5vw,72px)">
      <div style="max-width:1240px;margin:0 auto">
        <span style="font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#D1A859">Gallery</span>
        <h1 style="margin:18px 0 20px;font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(34px,5.4vw,74px);line-height:1.08;color:#F5EFE5;max-width:20ch">The property, in frames</h1>
        <p style="margin:0;font-size:clamp(16px,1.25vw,19px);line-height:1.8;color:rgba(245,239,229,.86);max-width:52ch">Exterior, rooms, garden, pool, events and décor. Tap any frame to open it full screen.</p>
      </div>
    </section>

    <section data-screen-label="Filters" style="padding:clamp(30px,4vw,52px) clamp(20px,5vw,72px) 0">
      <div style="max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.pick }}" style="background:{{ f.bg }};color:{{ f.fg }};border:1px solid rgba(209,168,89,.6);font-size:13.5px;font-weight:600;letter-spacing:.04em;padding:12px 20px;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="border-color:#D1A859">{{ f.label }}</button>
        </sc-for>
      </div>
    </section>

    <section data-screen-label="Masonry" style="padding:clamp(28px,4vw,48px) clamp(20px,5vw,72px) clamp(60px,8vw,120px)">
      <div style="max-width:1240px;margin:0 auto;column-count:{{ cols }};column-gap:18px">
        <sc-for list="{{ shots }}" as="g" hint-placeholder-count="10">
          <div onClick="{{ g.open }}" style="break-inside:avoid;margin-bottom:18px;cursor:pointer;position:relative;height:{{ g.h }};border:1px solid rgba(209,168,89,.45);background-image:url({{ g.url }});background-size:cover;background-position:center;background-color:#EDE3D2;display:flex;align-items:flex-end;padding:16px">
          </div>
        </sc-for>
      </div>
    </section>

    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:90;background:rgba(45,37,35,.95);display:flex;align-items:center;justify-content:center;padding:clamp(18px,5vw,70px);animation:riseIn .28s ease both">
        <button onClick="{{ close }}" aria-label="Close" style="position:absolute;top:18px;right:18px;width:46px;height:40px;background:transparent;border:1px solid rgba(209,168,89,.55);color:#D1A859;font-size:20px;line-height:1;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">×</button>
        <button onClick="{{ prev }}" aria-label="Previous" style="position:absolute;left:14px;width:46px;height:46px;background:transparent;border:1px solid rgba(209,168,89,.55);color:#D1A859;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">←</button>
        <button onClick="{{ next }}" aria-label="Next" style="position:absolute;right:14px;width:46px;height:46px;background:transparent;border:1px solid rgba(209,168,89,.55);color:#D1A859;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">→</button>
        <div style="width:min(100%,1000px);height:min(78vh,680px);border:1px solid rgba(209,168,89,.5);background-image:url({{ bigUrl }});background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#3F2423;display:flex;align-items:center;justify-content:center">
        </div>
      </div>
    </sc-if>

    <section data-screen-label="CTA" style="background:#5D2B2A;padding:clamp(56px,8vw,110px) clamp(20px,5vw,72px)">
      <div style="max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:26px">
        <h2 style="margin:0;font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(26px,3.4vw,44px);line-height:1.18;color:#F5EFE5;max-width:24ch">Come see it in person</h2>
        <div style="display:flex;flex-wrap:wrap;gap:14px">
          <a href="{{ waHref }}" style="background:#128C4A;color:#FFFFFF;font-size:14px;font-weight:600;padding:18px 30px;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#0E7A3F"><svg viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-4px;margin-right:9px;flex:0 0 auto" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.9-.94 1.08-.17.18-.35.2-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.48-1.88-.15-.3-.02-.47.13-.62.15-.15.35-.42.52-.63.17-.2.22-.35.33-.58.1-.22.05-.42-.03-.6-.07-.17-.67-1.63-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.81 1.2 3 .15.2 2.06 3.28 5.02 4.47 2.96 1.18 2.96.79 3.5.74.53-.05 1.73-.7 1.98-1.38.25-.68.25-1.26.17-1.38-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01c-1.72 0-3.4-.46-4.88-1.34l-.35-.2-3.63.95.97-3.54-.23-.37a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.99 6.68 2.77a9.36 9.36 0 012.77 6.68c0 5.2-4.25 9.43-9.46 9.43zm8.04-17.48A11.36 11.36 0 0012.04.5C5.78.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.5 23.5l6.15-1.61a11.34 11.34 0 005.39 1.37h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.31-8.01z"/></svg>{{ phone }}</a>
          <a href="Contact.dc.html" style="border:1px solid rgba(209,168,89,.6);color:#D1A859;font-size:14px;font-weight:600;padding:18px 30px;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">Directions</a>
        </div>
      </div>
    </section>
  </main>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    isMobile: typeof window !== 'undefined' && window.innerWidth < 980,
    filter: 'All',
    index: null,
  };

  all = [
    { label: 'Exterior, day', url: 'https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=1600&q=70', tag: 'Exterior', h: 300 },
    { label: 'Room interior', url: 'https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1600&q=70', tag: 'Rooms', h: 220 },
    { label: 'Garden lawn', url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=70', tag: 'Garden', h: 360 },
    { label: 'Swimming pool', url: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1600&q=70', tag: 'Pool', h: 240 },
    { label: 'Event décor', url: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=70', tag: 'Events', h: 320 },
    { label: 'Night view', url: 'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1600&q=70', tag: 'Exterior', h: 280 },
    { label: 'Reception', url: 'https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=1600&q=70', tag: 'Exterior', h: 200 },
    { label: 'Mandap detail', url: 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1600&q=70', tag: 'Events', h: 340 },
    { label: 'Poolside lounge', url: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1600&q=70', tag: 'Pool', h: 250 },
    { label: 'Bathroom detail', url: 'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?auto=format&fit=crop&w=1600&q=70', tag: 'Rooms', h: 230 },
    { label: 'Garden pathway', url: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=70', tag: 'Garden', h: 300 },
    { label: 'Haldi setup', url: 'https://images.unsplash.com/photo-1509610973147-232dfea52a97?auto=format&fit=crop&w=1600&q=70', tag: 'Events', h: 270 },
  ];

  componentDidMount() {
    this.onResize = () => this.setState({ isMobile: window.innerWidth < 980 });
    window.addEventListener('resize', this.onResize);
    this.onKey = (e) => {
      if (this.state.index === null) return;
      if (e.key === 'Escape') this.setState({ index: null });
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
  }

  visible() {
    const f = this.state.filter;
    return f === 'All' ? this.all : this.all.filter(s => s.tag === f);
  }

  step(d) {
    const n = this.visible().length;
    this.setState(s => ({ index: (s.index + d + n) % n }));
  }

  renderVals() {
    const m = this.state.isMobile;
    const phone = '8700616225';
    const shots = this.visible();
    const tags = ['All', 'Exterior', 'Rooms', 'Garden', 'Pool', 'Events'];
    return {
      phone,
      waHref: 'https://wa.me/91' + phone,
      topPad: m ? '64px' : '80px',
      botPad: m ? '56px' : '0px',
      cols: m ? 2 : 3,
      filters: tags.map(t => ({
        label: t,
        bg: this.state.filter === t ? '#5D2B2A' : 'transparent',
        fg: this.state.filter === t ? '#F5EFE5' : '#5D2B2A',
        pick: () => this.setState({ filter: t, index: null }),
      })),
      shots: shots.map((s, i) => ({
        label: s.label,
        url: s.url,
        h: (m ? Math.round(s.h * 0.72) : s.h) + 'px',
        open: () => this.setState({ index: i }),
      })),
      open: this.state.index !== null,
      label: this.state.index !== null && shots[this.state.index] ? shots[this.state.index].label : '',
      bigUrl: this.state.index !== null && shots[this.state.index] ? shots[this.state.index].url : '',
      close: () => this.setState({ index: null }),
      next: (e) => { e.stopPropagation(); this.step(1); },
      prev: (e) => { e.stopPropagation(); this.step(-1); },
    };
  }
}
</script>
</body>
</html>
